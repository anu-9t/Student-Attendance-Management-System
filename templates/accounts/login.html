<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | SAMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container" style="max-width: 420px; margin-top: 10vh;">
    <h1 class="h4 mb-1">Student Attendance Management System</h1>
    <p class="text-muted mb-4">Log in with the username and password given by your administrator.</p>

    <form method="post" class="card card-body shadow-sm">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert alert-danger py-2">{{ form.non_field_errors|join:" " }}</div>
      {% endif %}

      <label for="id_username" class="form-label">Username</label>
      <input type="text" name="username" id="id_username" class="form-control mb-3"
             value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>

      <label for="id_password" class="form-label">Password</label>
      <input type="password" name="password" id="id_password" class="form-control mb-3"
             autocomplete="current-password" required>

      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
  </main>
</body>
</html>
