# Three containers, as in SAD 3.6: Nginx, Django (gunicorn), MySQL.
# Each one has a health check and restarts on its own if it stops (SAM-NF-002).
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sams}
      MYSQL_USER: ${DB_USER:-sams}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sams}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn sams.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    # SAM-NF-002: Docker restarts the app if it stops answering /health/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped

  nginx:
    build: ./nginx
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-localhost}
      TLS_DAYS: ${TLS_DAYS:-365}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static:/app/staticfiles:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  dbdata:
  static:
  nginx_certs:
