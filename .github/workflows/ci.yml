
name: SAMS CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project documentation
        run: |
          test -f README.md
          test -f software-architecture-design-team-3.pdf
          test -f software-requirements-specification-team-3.pdf
          test -f test-plan-team-3.pdf
          echo "Project documentation check passed."

  python-quality:
    name: Tests, coverage and Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install quality tools
        run: python -m pip install pytest pytest-cov bandit

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "requirements.txt is not available yet."
          fi

      - name: Run tests with branch coverage
        run: |
          if [ -f manage.py ]; then
            python -m pip install django
            python manage.py test
          elif [ -d tests ] && find tests -name 'test_*.py' -print -quit | grep -q .; then
            pytest --cov=. --cov-branch --cov-report=term-missing
          else
            echo "Tests deferred: Django application and test suite are not ready."
          fi

      - name: Run Bandit security scan
        run: |
          if find . -name '*.py' -not -path './.git/*' -not -path './.venv/*' -print -quit | grep -q .; then
            bandit -r . -x .git,.venv
          else
            echo "Bandit scan deferred: no Python files found."
          fi

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image when Dockerfile exists
        run: |
          if [ -f Dockerfile ]; then
            docker build -t sams:ci .
          else
            echo "Docker build deferred: Dockerfile is not available yet."
          fi
